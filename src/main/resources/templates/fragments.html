<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head><meta charset="UTF-8"></head>
<body>

<th:block th:fragment="pageHead(title)">
    <meta charset="UTF-8"/>
    <title th:text="${title}">Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body { background-color: #f9f9f9; }
    .app-navbar { background-color: #252525; }
    .app-navbar .navbar-text { font-size: 1rem; }
    .sidebar { width: 220px; min-height: calc(100vh - 56px); background-color: #ffffff; border-right: 1px solid #e1e1e1; padding-top: 0; }
    .sidebar .nav-link { border-radius: 0; padding: 1rem 1.5rem; color: #0d6bf8; font-weight: 500; }
    .sidebar .nav-link.active { background-color: #0d6bf8; color: #fff; }
    .sidebar .nav-link:hover:not(.active) { background-color: #f3f3f3; }
    .panel-header { background-color: #f9f9f9; border-bottom: 1px solid #e1e1e1; padding: 0.9rem 1.5rem; font-weight: 600; }
    .nav-tabs .nav-link { color: #525252; }
    .nav-tabs .nav-link.active { font-weight: 600; }
    .card { border-top-left-radius: 0; }
  </style>
</th:block>

<nav th:fragment="navbar" class="navbar app-navbar navbar-dark px-3 py-2">
    <span class="navbar-text text-white fw-bold">
        <span sec:authentication="name">username</span>
        &nbsp;with roles&nbsp;
        <span>[<span th:each="a,iter : ${#authentication.authorities}"
                     th:text="${#strings.replace(a.authority,'ROLE_','')} + (${iter.last} ? '' : ', ')"></span>]</span>
    </span>
    <form th:action="@{/logout}" method="post" class="ms-auto mb-0">
        <button type="submit" class="btn btn-link text-white-50 text-decoration-none p-0">Logout</button>
    </form>
</nav>

<div th:fragment="sidebar(activePage)" class="sidebar">
    <ul class="nav flex-column">
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:classappend="${activePage == 'admin'} ? 'active' : ''" th:href="@{/admin}">Admin</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activePage == 'user'} ? 'active' : ''" th:href="@{/user}">User</a>
        </li>
    </ul>
</div>
</body>
</html>
