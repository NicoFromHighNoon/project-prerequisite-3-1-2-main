<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: pageHead('Admin Panel - New User')}"></th:block>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar('admin')}"></div>

    <div class="flex-grow-1 p-4">
        <h1 class="mb-4">Admin panel</h1>

        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin}">All Users</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/admin/new}">New User</a>
            </li>
        </ul>

        <div class="card">
            <div class="panel-header">Add new user</div>
            <div class="card-body">
                <form th:action="@{/admin/create}" method="post" style="max-width: 480px; margin: 0 auto;">
                    <div class="mb-3">
                        <label class="form-label fw-bold">First Name</label>
                        <input type="text" class="form-control" name="firstName"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Last Name</label>
                        <input type="text" class="form-control" name="lastName"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Age</label>
                        <input type="number" class="form-control" name="age"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" name="username" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" name="email"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select" name="roles" multiple size="2">
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success">Add new user</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
