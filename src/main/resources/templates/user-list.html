<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: pageHead('Admin Panel - All Users')}"></th:block>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar('admin')}"></div>

    <div class="flex-grow-1 p-4">
        <h1 class="mb-4">Admin panel</h1>

        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/admin}">All Users</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/new}">New User</a>
            </li>
        </ul>

        <div class="card">
            <div class="panel-header">All Users</div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td class="ps-3" th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            [<span th:each="r,iter : ${user.roles}"
                                   th:text="${#strings.replace(r.name,'ROLE_','')} + (${iter.last} ? '' : ', ')"></span>]
                        </td>
                        <td>
                            <button type="button" class="btn btn-info btn-sm text-white"
                                    data-bs-toggle="modal" th:data-bs-target="${'#editModal' + user.id}">Edit</button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal" th:data-bs-target="${'#deleteModal' + user.id}">Delete</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:each="user : ${users}">
            <div class="modal fade" th:id="${'editModal' + user.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form th:action="@{/admin/update}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title">Edit user</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" name="id" th:value="${user.id}"/>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ID</label>
                                    <input type="text" class="form-control" th:value="${user.id}" disabled/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">First Name</label>
                                    <input type="text" class="form-control" name="firstName" th:value="${user.firstName}"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Last Name</label>
                                    <input type="text" class="form-control" name="lastName" th:value="${user.lastName}"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Age</label>
                                    <input type="number" class="form-control" name="age" th:value="${user.age}"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Username</label>
                                    <input type="text" class="form-control" name="username" th:value="${user.username}" required/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" name="email" th:value="${user.email}"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Password</label>
                                    <input type="password" class="form-control" name="password"
                                           placeholder="Leave blank to keep current password"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Role</label>
                                    <select class="form-select" name="roles" multiple size="2">
                                        <option value="ADMIN" th:selected="${user.hasRole('ADMIN')}">ADMIN</option>
                                        <option value="USER" th:selected="${user.hasRole('USER')}">USER</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="modal fade" th:id="${'deleteModal' + user.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Delete user</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">ID</label>
                                <input type="text" class="form-control" th:value="${user.id}" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">First Name</label>
                                <input type="text" class="form-control" th:value="${user.firstName}" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Last Name</label>
                                <input type="text" class="form-control" th:value="${user.lastName}" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Age</label>
                                <input type="text" class="form-control" th:value="${user.age}" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Username</label>
                                <input type="text" class="form-control" th:value="${user.username}" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="text" class="form-control" th:value="${user.email}" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" value="" disabled/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Role</label>
                                <select class="form-select" multiple size="2" disabled>
                                    <option value="ADMIN" th:selected="${user.hasRole('ADMIN')}">ADMIN</option>
                                    <option value="USER" th:selected="${user.hasRole('USER')}">USER</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <form th:action="@{/admin/delete(id=${user.id})}" method="post" class="mb-0">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
