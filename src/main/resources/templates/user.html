<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: pageHead('User')}"></th:block>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar('user')}"></div>

    <div class="flex-grow-1 p-4">
        <h1 class="mb-4">User Information Page</h1>

        <div class="card" th:if="${user != null}">
            <div class="panel-header">About User</div>
            <div class="card-body p-0">
                <table class="table mb-0 align-middle">
                    <thead>
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Roles</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td class="ps-3" th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            [<span th:each="r,iter : ${user.roles}"
                                   th:text="${#strings.replace(r.name,'ROLE_','')} + (${iter.last} ? '' : ', ')"></span>]
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
